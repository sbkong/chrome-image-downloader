<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 340px; margin: 0; padding: 16px; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    h2 { font-size: 12px; margin: 0; color: #333; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    button { padding: 8px; border: none; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; background: #4CAF50; }
    button:hover { background: #43a047; }
    button:disabled { background: #bbb; cursor: default; }
    button.small { padding: 5px 9px; font-size: 11px; white-space: nowrap; }
    button.done { background: #2e7d32; } button.done:hover { background: #276b2b; }
    #refresh { background: #666; } #refresh:hover { background: #555; }
    #downloadSel { background: #388e3c; } #downloadSel:hover { background: #2e7d32; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid #eee; margin-bottom: 12px; }
    .tab { background: none; color: #666; border: none; border-radius: 0; border-bottom: 2px solid transparent; padding: 7px 12px; font-size: 13px; font-weight: 600; }
    .tab:hover { background: #f5f5f5; }
    .tab.active { color: #4CAF50; border-bottom-color: #4CAF50; }

    #list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 300px; overflow-y: auto; }
    #list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f2f2f2; }
    #list li .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; cursor: pointer; }
    #list li input.sel { flex: none; width: 15px; height: 15px; cursor: pointer; accent-color: #4CAF50; }
    #list li input.sel:disabled { cursor: default; opacity: .4; }
    #list .thumb { flex: none; width: 42px; height: 42px; object-fit: cover; border-radius: 4px; background: #eee; }
    #list .thumb.broken { border: 1px dashed #ccc; }
    #list .meta { flex: 1; min-width: 0; }
    #list .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #list .dim { color: #999; font-size: 11px; }
    #list .rowStatus { font-size: 11px; color: #555; white-space: nowrap; }
    #list .rowStatus.err { color: #c62828; white-space: normal; max-width: 90px; }
    .empty { color: #999; font-size: 12px; padding: 6px 0; }

    .head-left { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; cursor: pointer; user-select: none; }
    #selectAll { width: 15px; height: 15px; cursor: pointer; accent-color: #4CAF50; }
    .head-actions { display: flex; gap: 6px; }

    .filter { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 12px; color: #444; flex-wrap: wrap; }
    .filter .fchk { display: flex; align-items: center; gap: 5px; margin: 0; font-weight: 600; cursor: pointer; user-select: none; }
    .filter .fchk input { width: 15px; height: 15px; cursor: pointer; accent-color: #4CAF50; }
    .filter input[type="number"] { width: 54px; box-sizing: border-box; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .filter input[type="number"]:focus { outline: none; border-color: #4CAF50; }
    .filter .unit, .filter .x { color: #888; }

    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
    input[type="text"]:focus { outline: none; border-color: #4CAF50; }
    .hint { color: #777; font-size: 11px; line-height: 1.5; margin: 8px 0 10px; }
    .hint code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    .toggle { display: flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; user-select: none; margin: 6px 0; }
    .toggle input { width: 15px; height: 15px; cursor: pointer; accent-color: #4CAF50; }
    .capture { box-sizing: border-box; width: 100%; padding: 8px 9px; margin: 4px 0 8px; border: 1px dashed #bbb; border-radius: 5px; font-size: 13px; color: #333; background: #fafafa; cursor: pointer; user-select: none; text-align: center; }
    .capture:focus { outline: none; }
    .capture.capturing { border-style: solid; border-color: #4CAF50; background: #f1f8f1; color: #2e7d32; }
    .capture.disabled { opacity: .45; pointer-events: none; }
    #save { width: 100%; background: #666; } #save:hover { background: #555; }
    #saveStatus { text-align: center; color: #2e7d32; font-size: 12px; height: 15px; margin-top: 6px; }
    .usage { color: #555; font-size: 11px; margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; line-height: 1.6; }
    #tab-settings .settings { margin-top: 0; }
  </style>
</head>
<body>
  <h1 data-i18n="popupHeading"></h1>

  <div class="tabs">
    <button class="tab active" data-tab="images" data-i18n="tabImages"></button>
    <button class="tab" data-tab="settings" data-i18n="tabSettings"></button>
  </div>

  <div id="tab-images" class="tabpane">
    <div class="filter" title="" data-i18n-title="filterTitle">
      <label class="fchk"><input type="checkbox" id="filterEnabled"> <span data-i18n="filterApply"></span></label>
      <input type="number" id="filterW" min="0" value="100"><span class="unit">px</span>
      <span class="x">×</span>
      <input type="number" id="filterH" min="0" value="100"><span class="unit">px</span>
    </div>
    <div class="row">
      <label class="head-left" title="" data-i18n-title="selectAllTitle">
        <input type="checkbox" id="selectAll">
        <h2 data-i18n="imagesHeading"></h2>
      </label>
      <span class="head-actions">
        <button id="refresh" class="small" data-i18n="refreshImages"></button>
        <button id="downloadSel" class="small" data-i18n="downloadSelected"></button>
      </span>
    </div>
    <ul id="list"></ul>
    <div class="usage"></div>
  </div>

  <div id="tab-settings" class="tabpane" hidden>
    <div class="settings">
      <label for="subfolder" data-i18n="subfolderLabel"></label>
      <input type="text" id="subfolder" data-i18n-ph="subfolderPlaceholder">
      <div class="hint" data-i18n-html="subfolderHint"></div>

      <label class="toggle"><input type="checkbox" id="shortcutEnabled"> <span data-i18n="shortcutEnabledLabel"></span></label>
      <div id="shortcutCapture" class="capture" tabindex="0"></div>
      <label class="toggle"><input type="checkbox" id="badgeEnabled"> <span data-i18n="badgeEnabledLabel"></span></label>

      <button id="save" data-i18n="saveButton"></button>
      <div id="saveStatus"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
